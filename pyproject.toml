[build-system]
requires = ["setuptools>=65.5"]
build-backend = "setuptools.build_meta"

[project]
name = "aios-linux-incident"
version = "0.1.0"
description = "AIOS-based Linux service incident diagnosis, repair, and verification"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "anyio>=4.6,<4.11",
  "fastapi>=0.116,<0.117",
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "uvicorn>=0.35,<0.36",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<0.29",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
aios-incident = "aios_incident.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["aios_incident*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "integration: requires a running local AIOS and Ollama environment",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

