<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="580" viewBox="0 0 1080 580">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#31546d"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f7f9"/>
<text x="38" y="38" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#142433">W05 API 请求与结构化响应</text><text x="38" y="62" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#657887">本地 FastAPI 实际请求记录</text><rect x="38" y="100" width="315" height="82" rx="9" fill="#ffffff" stroke="#9eb2c0"/><text x="54" y="127" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#142433">创建 Incident</text><text x="54" y="151" font-family="Consolas, monospace" font-size="11" fill="#657887">POST /api/v1/incidents</text><text x="54" y="171" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#175f70">HTTP 201</text><rect x="378" y="100" width="315" height="82" rx="9" fill="#ffffff" stroke="#9eb2c0"/><text x="394" y="127" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#142433">查询状态</text><text x="394" y="151" font-family="Consolas, monospace" font-size="11" fill="#657887">GET /api/v1/incidents/inc-20...001225Z-9eee538cb2b5</text><text x="394" y="171" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#175f70">HTTP 200</text><rect x="718" y="100" width="315" height="82" rx="9" fill="#ffffff" stroke="#9eb2c0"/><text x="734" y="127" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#142433">查询 DAG</text><text x="734" y="151" font-family="Consolas, monospace" font-size="11" fill="#657887">GET /api/v1/incidents/inc-20...25Z-9eee538cb2b5/dag</text><text x="734" y="171" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#175f70">HTTP 200</text><rect x="38" y="205" width="315" height="82" rx="9" fill="#ffffff" stroke="#9eb2c0"/><text x="54" y="232" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#142433">查询事件</text><text x="54" y="256" font-family="Consolas, monospace" font-size="11" fill="#657887">GET /api/v1/incidents/inc-20...-9eee538cb2b5/events</text><text x="54" y="276" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#175f70">HTTP 200</text><rect x="378" y="205" width="315" height="82" rx="9" fill="#ffffff" stroke="#9eb2c0"/><text x="394" y="232" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#142433">取消 Incident</text><text x="394" y="256" font-family="Consolas, monospace" font-size="11" fill="#657887">POST /api/v1/incidents/inc-20...-9eee538cb2b5/cancel</text><text x="394" y="276" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#175f70">HTTP 200</text><rect x="718" y="205" width="315" height="82" rx="9" fill="#ffffff" stroke="#9eb2c0"/><text x="734" y="232" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#142433">取消后 Trace</text><text x="734" y="256" font-family="Consolas, monospace" font-size="11" fill="#657887">GET /api/v1/incidents/inc-20...-9eee538cb2b5/events</text><text x="734" y="276" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#175f70">HTTP 200</text><rect x="38" y="310" width="315" height="82" rx="9" fill="#ffffff" stroke="#b54b4b"/><text x="54" y="337" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#142433">未知 Incident</text><text x="54" y="361" font-family="Consolas, monospace" font-size="11" fill="#657887">GET /api/v1/incidents/inc-does-not-exist</text><text x="54" y="381" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#b54b4b">HTTP 404</text><rect x="378" y="310" width="315" height="82" rx="9" fill="#ffffff" stroke="#9eb2c0"/><text x="394" y="337" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#142433">历史运行</text><text x="394" y="361" font-family="Consolas, monospace" font-size="11" fill="#657887">GET /api/v1/incidents</text><text x="394" y="381" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#175f70">HTTP 200</text><rect x="718" y="310" width="315" height="82" rx="9" fill="#ffffff" stroke="#9eb2c0"/><text x="734" y="337" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#142433">基准数据</text><text x="734" y="361" font-family="Consolas, monospace" font-size="11" fill="#657887">GET /api/v1/benchmarks/latest</text><text x="734" y="381" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#175f70">HTTP 200</text><rect x="38" y="430" width="995" height="85" rx="9" fill="#fff4f3" stroke="#b54b4b"/><text x="60" y="460" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#b54b4b">结构化 404 错误</text><text x="60" y="486" font-family="Consolas, monospace" font-size="12" fill="#142433">INCIDENT_NOT_FOUND: incident not found: inc-does-not-exist</text><text x="38" y="545" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#657887">完整响应、OpenAPI 和 Trace 保存在 evidence/api/</text>
</svg>
