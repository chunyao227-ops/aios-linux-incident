# Application configuration example.
# Copy this file for local use and keep environment-specific overrides uncommitted.
version: 1

app:
  name: aios-linux-incident
  environment: development
  log_level: INFO

aios:
  base_url: http://127.0.0.1:8000
  timeout_seconds: 30
  max_retries: 2

# Switch deployments by changing this section. No code change is required.
# For remote vLLM, set deployment to remote, replace base_url/name, and set
# api_key_env to the name of an environment variable. Never place a key here.
model:
  deployment: local
  backend: openai-compatible
  name: qwen2:7b-instruct
  base_url: http://127.0.0.1:11434/v1
  served_model_name: qwen2:7b-instruct
  api_key_env: null
  timeout_seconds: 120
  max_retries: 2
  temperature: 0.0
  max_tokens: 1024

workflow:
  collect_concurrency: 4
  task_timeout_seconds: 180
  max_repair_rounds: 2

runtime:
  output_dir: runs

